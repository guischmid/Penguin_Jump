<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Penguin Jump</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #06080f;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #wrap {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 60px rgba(80, 160, 255, .18);
    border-radius: 6px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- overlays ---------- */
  .ui {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    text-align: center;
    color: #eaf6ff;
    background: rgba(7, 14, 28, .55);
    backdrop-filter: blur(3px);
    opacity: 1;
    transition: opacity .25s ease, visibility .25s;
  }
  .ui.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
  .title {
    font-size: 54px;
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1.05;
    background: linear-gradient(180deg, #ffffff 20%, #9fd8ff 55%, #4a9fe8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 rgba(10, 40, 80, .8));
  }
  .subtitle { font-size: 15px; color: #a8cfec; letter-spacing: 1px; margin-top: -10px; }
  .big { font-size: 40px; font-weight: 800; letter-spacing: 2px; color: #ffd9d0; text-shadow: 0 3px 0 rgba(60,10,10,.6); }
  .score-line { font-size: 22px; }
  .score-line b { color: #ffe27a; }
  .newbest {
    font-size: 16px; font-weight: 700; color: #ffe27a;
    animation: pulse 1s ease infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
  .help {
    font-size: 14px; line-height: 1.9; color: #c4dff2;
    background: rgba(10, 25, 50, .5);
    border: 1px solid rgba(140, 200, 255, .25);
    border-radius: 12px;
    padding: 12px 22px;
  }
  .help kbd {
    background: #17314f; border: 1px solid #3f6c9c; border-bottom-width: 3px;
    border-radius: 5px; padding: 1px 7px; font-family: inherit; font-size: 12px; color: #fff;
  }
  button.btn {
    font: inherit;
    font-size: 18px; font-weight: 700; letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(180deg, #3f9be0, #2470b4);
    border: none; border-bottom: 4px solid #174e80;
    border-radius: 12px;
    padding: 12px 44px;
    cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  button.btn:hover { filter: brightness(1.12); }
  button.btn:active { transform: translateY(3px); border-bottom-width: 1px; }
  button.btn.alt { background: linear-gradient(180deg, #5a6d85, #40506a); border-bottom-color: #2a3648; font-size: 15px; padding: 10px 30px; }
  .btnrow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .hint { font-size: 12px; color: #8fb4d4; }

  /* ---------- corner buttons ---------- */
  #corner {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 8px;
  }
  #corner button {
    width: 40px; height: 40px;
    font-size: 19px;
    background: rgba(12, 30, 55, .55);
    border: 1px solid rgba(150, 205, 255, .3);
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
  }
  #corner button:hover { background: rgba(30, 60, 100, .75); }

  /* ---------- touch controls ---------- */
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.touch #touch { display: block; }
  #touch .tbtn {
    position: absolute; bottom: 14px;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(20, 45, 80, .45);
    border: 2px solid rgba(160, 210, 255, .4);
    color: #fff; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  #touch .tbtn:active { background: rgba(70, 130, 200, .6); }
  #tL { left: 14px; }
  #tR { left: 90px; }
  #tShoot { right: 90px; font-size: 22px; }
  #tJump { right: 14px; bottom: 44px; width: 76px; height: 76px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div class="ui hidden" id="menu">
    <div class="title">PENGUIN<br>JUMP</div>
    <div class="subtitle">❄ REBUILT EDITION ❄</div>
    <div class="score-line">Best: <b id="menuBest">0</b></div>
    <div class="help">
      <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> &nbsp;move<br>
      <kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> &nbsp;jump &nbsp;·&nbsp; <kbd>E</kbd> throw snowball<br>
      <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>M</kbd> mute<br>
      Climb fast — the lava is rising!
    </div>
    <button class="btn" id="btnStart">▶ &nbsp;START</button>
    <div class="hint">or press Enter</div>
  </div>

  <div class="ui hidden" id="pause">
    <div class="big" style="color:#cfe8ff">PAUSED</div>
    <div class="btnrow">
      <button class="btn" id="btnResume">RESUME</button>
    </div>
    <div class="btnrow">
      <button class="btn alt" id="btnPRestart">RESTART</button>
      <button class="btn alt" id="btnPMenu">MENU</button>
    </div>
  </div>

  <div class="ui hidden" id="over">
    <div class="big">GAME OVER</div>
    <div class="score-line">Score: <b id="overScore">0</b></div>
    <div class="score-line">Best: <b id="overBest">0</b></div>
    <div class="newbest hidden" id="newBest">★ NEW BEST! ★</div>
    <div class="btnrow">
      <button class="btn" id="btnReplay">↻ &nbsp;REPLAY</button>
      <button class="btn alt" id="btnOMenu">MENU</button>
    </div>
    <div class="hint">or press R</div>
  </div>

  <div id="corner">
    <button id="btnPause" title="Pause (P)">⏸</button>
    <button id="btnMute" title="Mute (M)">🔊</button>
  </div>

  <div id="touch">
    <div class="tbtn" id="tL">◀</div>
    <div class="tbtn" id="tR">▶</div>
    <div class="tbtn" id="tShoot">❄</div>
    <div class="tbtn" id="tJump">⬆</div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   PENGUIN JUMP — Rebuilt Edition
   A faithful, improved remake of the Unity exam project in this repo:
   vertical platformer — climb procedurally generated platforms, grab
   power-ups, dodge or shoot monsters, and stay ahead of the rising lava.
   Fully self-contained: procedural art, WebAudio sound, no assets.
   ===================================================================== */

// ---------------------------------------------------------------- consts
const W = 480, H = 720;            // logical resolution
const DT = 1 / 60;                 // fixed physics timestep
const GRAV = 2300;                 // gravity px/s²
const JUMP_V = 860;                // jump velocity px/s
const MOVE = 330;                  // max horizontal speed
const ACCEL = 3000, DECEL = 2600;  // horizontal accel / friction
const MAX_FALL = 1300;
const COYOTE = 0.09, JUMP_BUF = 0.13;
const P_W = 34, P_H = 42;          // player hitbox
const WALL_L = 19, WALL_R = W - 19;
const SPRING_V = 1560;             // trampoline pickup launch
const LAVA_BOUNCE_V = 1500;        // bounce when touching lava
const WINGS_TIME = 3.2, WINGS_V = 430;
const DJUMP_TIME = 10;
const SHOOT_CD = 0.4, SHOT_SPEED = 720;
const MAX_HP = 3;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];

// ---------------------------------------------------------------- canvas
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let RS = 1; // render scale (dpr)

function resize() {
  const scale = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  const wrap = document.getElementById("wrap");
  wrap.style.width = cw + "px";
  wrap.style.height = ch + "px";
  RS = Math.min(devicePixelRatio || 1, 2) * scale;
  canvas.width = Math.round(W * RS);
  canvas.height = Math.round(H * RS);
}
addEventListener("resize", resize);
resize();

if (matchMedia("(pointer: coarse)").matches) document.body.classList.add("touch");

// ---------------------------------------------------------------- audio
const AudioCls = window.AudioContext || window.webkitAudioContext;
let ac = null, master = null;
let muted = localStorage.getItem("pj-muted") === "1";

function audioInit() {
  if (ac || !AudioCls) return;
  try {
    ac = new AudioCls();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(ac.destination);
  } catch (e) { ac = null; }
}
function setMuted(m) {
  muted = m;
  localStorage.setItem("pj-muted", m ? "1" : "0");
  if (master) master.gain.value = m ? 0 : 0.5;
  document.getElementById("btnMute").textContent = m ? "🔇" : "🔊";
}
function tone(freq, dur, type = "square", vol = 0.2, slideTo = null, delay = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.25, lp = 1200) {
  if (!ac || muted) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(master);
  src.start();
}
const sfx = {
  jump()   { tone(340, 0.14, "square", 0.14, 620); },
  djump()  { tone(460, 0.16, "square", 0.14, 820); },
  spring() { tone(180, 0.34, "square", 0.2, 950); },
  pickup() { tone(660, 0.09, "sine", 0.2); tone(990, 0.14, "sine", 0.2, null, 0.08); },
  heart()  { tone(520, 0.1, "sine", 0.2); tone(660, 0.1, "sine", 0.2, null, 0.09); tone(880, 0.16, "sine", 0.2, null, 0.18); },
  throw()  { noise(0.09, 0.15, 3200); },
  stomp()  { tone(300, 0.1, "square", 0.18, 120); noise(0.06, 0.12, 900); },
  kill()   { noise(0.14, 0.2, 1500); tone(200, 0.16, "sawtooth", 0.1, 60); },
  hurt()   { tone(200, 0.22, "sawtooth", 0.22, 70); },
  splash() { noise(0.4, 0.3, 700); tone(140, 0.3, "sine", 0.18, 50); },
  land()   { noise(0.04, 0.07, 800); },
  wings()  { tone(400, 0.5, "sine", 0.12, 900); },
  over()   { tone(392, 0.25, "triangle", 0.22); tone(311, 0.25, "triangle", 0.22, null, 0.25); tone(233, 0.5, "triangle", 0.22, null, 0.5); },
  ui()     { tone(500, 0.06, "square", 0.1, 700); },
};

// ---------------------------------------------------------------- input
const keys = {};
const keyMap = {
  ArrowLeft: "left", KeyA: "left",
  ArrowRight: "right", KeyD: "right",
  Space: "jump", ArrowUp: "jump", KeyW: "jump",
  KeyE: "shoot", KeyX: "shoot",
};
addEventListener("keydown", e => {
  audioInit();
  const k = keyMap[e.code];
  if (k) {
    e.preventDefault();
    if (!keys[k]) { keys[k] = true; onPress(k); }
    return;
  }
  if (e.code === "KeyP" || e.code === "Escape") { e.preventDefault(); togglePause(); }
  else if (e.code === "KeyM") setMuted(!muted);
  else if (e.code === "Enter") {
    if (state === "menu") startGame();
    else if (state === "gameover") startGame();
    else if (state === "paused") togglePause();
  }
  else if (e.code === "KeyR") {
    if (state === "gameover" || state === "paused") startGame();
  }
});
addEventListener("keyup", e => {
  const k = keyMap[e.code];
  if (k) { keys[k] = false; onRelease(k); }
});

function onPress(k) {
  if (state === "menu" && (k === "jump")) { startGame(); return; }
  if (state !== "playing") return;
  if (k === "jump") tryJump();
  if (k === "shoot") tryShoot();
}
function onRelease(k) {
  if (state !== "playing") return;
  // variable jump height: cut upward velocity on early release
  if (k === "jump" && player.vy < -JUMP_V * 0.42) player.vy = -JUMP_V * 0.42;
}

// touch buttons
function bindTouch(id, key) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); audioInit(); if (!keys[key]) { keys[key] = true; onPress(key); } };
  const up = e => { e.preventDefault(); keys[key] = false; onRelease(key); };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("pointerleave", up);
}
bindTouch("tL", "left"); bindTouch("tR", "right");
bindTouch("tJump", "jump"); bindTouch("tShoot", "shoot");

// ---------------------------------------------------------------- state
let state = "menu"; // menu | playing | paused | dying | gameover
let best = parseInt(localStorage.getItem("pj-best") || "0", 10) || 0;

let player, cam, lava, gen, effects;
let platforms, monsters, pickups, shots, particles, snow;
let startY = 0, camStart = 0, shake = 0, dyingT = 0, gameTime = 0;
let lastLandedPlat = null;

function score() { return Math.max(0, Math.round((startY - player.minY) / 10)); }
function climb() { return Math.max(0, startY - player.minY); }
// 0..1 difficulty ramp over ~900 m of generated height
function genDifficulty() { return Math.min(1, Math.max(0, (startY - gen.nextY) / 9000)); }

// ---------------------------------------------------------------- world init
function initWorld() {
  platforms = []; monsters = []; pickups = []; shots = []; particles = [];
  gameTime = 0; shake = 0; dyingT = 0; lastLandedPlat = null;

  const baseY = 80; // top of start platform
  platforms.push(makePlatform("ice", W / 2, baseY, 190));

  player = {
    x: W / 2, y: baseY - P_H / 2, vx: 0, vy: 0,
    w: P_W, h: P_H, face: 1,
    grounded: platforms[0], coyote: 0, jbuf: 0,
    usedDouble: false, invuln: 0, lavaCd: 0, shootCd: 0,
    squash: 0, stretch: 0, minY: baseY - P_H / 2, hp: MAX_HP,
    walkT: 0,
  };
  startY = player.y;

  cam = { y: baseY + 170 - H }; // start platform ~170px above screen bottom
  camStart = cam.y;
  lava = { y: baseY + 240, grace: 2.6, pause: 0, speed: 26, surfT: 0 };
  effects = { wings: 0, djump: 0 };
  gen = {
    nextY: baseY, lastX: W / 2, count: 0,
    consecL: 0, consecR: 0, blinkChain: 0, unstableChain: 0,
    fallInGroup: 0, lastWasMover: false, lastVRange: 0, sinceMonster: 99,
  };
  generateAhead();

  snow = [];
  for (let i = 0; i < 70; i++) snow.push(newFlake(true));
}

// ---------------------------------------------------------------- platforms
function makePlatform(type, x, y, w) {
  const p = {
    type, x, y, w: w || (type === "ice" ? 92 : 86), h: 18,
    solid: true, dx: 0, dy: 0, prevX: x, prevY: y,
    // movers
    baseX: x, baseY: y, range: 0, speed: 0, phase: rand(0, Math.PI * 2),
    // crack
    crState: "idle", crT: 0, vy: 0, homeY: y,
    // blink
    blinkT: rand(0, 4.2),
    icicles: [],
  };
  const n = randi(2, 4);
  for (let i = 0; i < n; i++) p.icicles.push({ o: rand(-0.35, 0.35), l: rand(5, 12) });
  if (type === "move-h") { p.range = rand(55, 95); p.speed = rand(0.9, 1.5); }
  if (type === "move-v") { p.range = rand(36, 60); p.speed = rand(0.9, 1.4); }
  return p;
}

function updatePlatform(p, dt) {
  p.prevX = p.x; p.prevY = p.y;
  if (p.type === "move-h") {
    p.phase += p.speed * dt;
    p.x = p.baseX + Math.sin(p.phase) * p.range;
  } else if (p.type === "move-v") {
    p.phase += p.speed * dt;
    p.y = p.baseY + Math.sin(p.phase) * p.range;
  } else if (p.type === "blink") {
    p.blinkT = (p.blinkT + dt) % 4.2;
    p.solid = p.blinkT < 2.6;
  } else if (p.type === "crack") {
    if (p.crState === "shake") {
      p.crT += dt;
      if (p.crT > 0.55) { p.crState = "fall"; p.solid = false; p.vy = 0; p.crT = 0; }
    } else if (p.crState === "fall") {
      p.crT += dt;
      if (p.y < p.homeY + 900) {
        p.vy += GRAV * 0.55 * dt;
        p.y += p.vy * dt;
      }
      // respawn in place after a while, like the original's PlatformRespawner
      if (p.crT > 3) {
        p.y = p.homeY; p.vy = 0; p.crT = 0;
        p.crState = "idle"; p.solid = true;
        puff(p.x, p.y + 6, 6);
      }
    }
  }
  p.dx = p.x - p.prevX; p.dy = p.y - p.prevY;
}

// procedural generation — mirrors the Unity PlatformSpawner rules, tuned:
// every 5th platform is a mover, a mover is always followed by a static,
// max 2 blink in a row, max 1 crumbling per group of 5, never more than
// 2 unstable platforms in a row, monsters/pickups only on plain ice.
function genNext() {
  const g = gen, t = genDifficulty();

  // --- type ---
  let type;
  if (g.lastWasMover) type = "ice";
  else if (g.count > 0 && g.count % 5 === 4) type = Math.random() < 0.5 ? "move-h" : "move-v";
  else {
    const opts = ["ice", "ice"];
    if (g.blinkChain < 2 && g.unstableChain < 2 && g.count > 4) opts.push("blink");
    if (g.fallInGroup < 1 && g.unstableChain < 2 && g.count > 4) opts.push("crack");
    type = pick(opts);
  }

  // --- vertical gap (reachable: max jump height ≈ 160px) ---
  const p0 = makePlatform(type, 0, 0); // roll ranges first so spacing can account for them
  let gap = 84 + 36 * t + rand(-12, 12);
  gap += g.lastVRange; // last platform was a vertical mover: leave room below its peak
  if (type === "move-v") gap = Math.max(gap, p0.range + 55); // its low point must clear the platform below
  gap = Math.min(gap, 140); // max jump height is ~160px — keep a margin

  // --- horizontal random walk, bounded, direction-limited ---
  const margin = 62;
  const dxMax = clamp((155 - gap) * 2.4 + 66, 70, 215);
  const step = rand(48, dxMax);
  let dir;
  if (g.lastX < margin + 40) dir = 1;
  else if (g.lastX > W - margin - 40) dir = -1;
  else if (g.consecL >= 4) dir = 1;
  else if (g.consecR >= 4) dir = -1;
  else dir = Math.random() < 0.5 ? -1 : 1;
  if (dir === 1) { g.consecR++; g.consecL = 0; } else { g.consecL++; g.consecR = 0; }

  let x = clamp(g.lastX + dir * step, margin, W - margin);
  const y = g.nextY - gap;

  const p = p0;
  p.x = x; p.y = y;
  p.baseX = x; p.baseY = y; p.homeY = y;
  p.prevX = x; p.prevY = y;
  if (type === "move-h") {
    // keep the whole travel range on screen
    p.baseX = clamp(x, margin + p.range - 20, W - margin - p.range + 20);
    p.x = p.baseX;
    x = p.baseX;
  }
  platforms.push(p);

  // --- monsters & pickups (plain ice only, like the original) ---
  g.sinceMonster++;
  if (type === "ice" && g.count > 7) {
    const r = Math.random();
    const mCh = 0.1 + 0.16 * t, pCh = 0.17;
    if (r < mCh && g.sinceMonster > 2) {
      spawnMonster(p);
      g.sinceMonster = 0;
    } else if (r < mCh + pCh) {
      spawnPickup(p);
    }
  }

  // --- track rules state ---
  g.lastX = x;
  g.nextY = y;
  g.lastWasMover = type === "move-h" || type === "move-v";
  g.lastVRange = type === "move-v" ? p.range : 0;
  g.blinkChain = type === "blink" ? g.blinkChain + 1 : 0;
  g.unstableChain = (type === "blink" || type === "crack") ? g.unstableChain + 1 : 0;
  if (type === "crack") g.fallInGroup++;
  g.count++;
  if (g.count % 5 === 0) g.fallInGroup = 0;
}

function generateAhead() {
  let guard = 0;
  while (gen.nextY > cam.y - 320 && guard++ < 400) genNext();
}

// ---------------------------------------------------------------- monsters
function spawnMonster(p) {
  const type = Math.random() < 0.6 ? "slime" : "bat";
  if (type === "slime") {
    monsters.push({
      type, plat: p, x: p.x, y: p.y - 14, w: 34, h: 26,
      dir: Math.random() < 0.5 ? -1 : 1, speed: rand(36, 60),
      t: rand(0, 9), dead: false, deadT: 0,
    });
  } else {
    monsters.push({
      type, plat: null, x: p.x, y: p.y - 96, w: 38, h: 28,
      baseX: p.x, baseY: p.y - 96, amp: rand(46, 72), spd: rand(1.1, 1.7),
      t: rand(0, 9), dead: false, deadT: 0, dir: 1,
    });
  }
}

function updateMonster(m, dt) {
  m.t += dt;
  if (m.dead) { m.deadT += dt; return; }
  if (m.type === "slime") {
    const p = m.plat;
    const lim = p.w / 2 - 14;
    m.x += m.dir * m.speed * dt + p.dx;
    m.y = p.y - 14 + p.dy * 0;
    m.y = p.y - 14;
    if (m.x > p.x + lim) { m.x = p.x + lim; m.dir = -1; }
    if (m.x < p.x - lim) { m.x = p.x - lim; m.dir = 1; }
  } else {
    const px = m.baseX + Math.sin(m.t * m.spd) * m.amp;
    m.dir = px > m.x ? 1 : -1;
    m.x = clamp(px, 30, W - 30);
    m.y = m.baseY + Math.sin(m.t * 2.3) * 9;
  }
}

function killMonster(m, stomped) {
  m.dead = true; m.deadT = 0;
  burst(m.x, m.y, m.type === "slime" ? "#7ed957" : "#b48cf2", 14);
  sfx[stomped ? "stomp" : "kill"]();
}

// ---------------------------------------------------------------- pickups
function spawnPickup(p) {
  const r = Math.random();
  const type = r < 0.3 ? "spring" : r < 0.55 ? "djump" : r < 0.8 ? "wings" : "heart";
  pickups.push({ type, x: p.x, y: p.y - 52, t: rand(0, 9), taken: false });
}

function applyPickup(pu) {
  // like the original: a new power-up replaces the current one
  effects.wings = 0; effects.djump = 0;
  switch (pu.type) {
    case "spring":
      player.vy = -SPRING_V;
      player.grounded = null;
      player.invuln = Math.max(player.invuln, 0.8);
      player.stretch = 1;
      burst(pu.x, pu.y, "#ff8563", 16);
      sfx.spring();
      break;
    case "wings":
      effects.wings = WINGS_TIME;
      player.grounded = null;
      burst(pu.x, pu.y, "#ffd465", 16);
      sfx.wings();
      break;
    case "djump":
      effects.djump = DJUMP_TIME;
      player.usedDouble = false;
      burst(pu.x, pu.y, "#7fd8ff", 16);
      sfx.pickup();
      break;
    case "heart":
      player.hp = Math.min(MAX_HP, player.hp + 1);
      burst(pu.x, pu.y, "#ff6b8d", 16);
      sfx.heart();
      break;
  }
}

// ---------------------------------------------------------------- particles
function burst(x, y, color, n, spd = 220) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(spd * 0.3, spd);
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
      life: rand(0.35, 0.7), t: 0, size: rand(2, 5), color, grav: 900,
    });
  }
}
function puff(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + rand(-12, 12), y, vx: rand(-60, 60), vy: rand(-90, -20),
      life: rand(0.25, 0.5), t: 0, size: rand(2.5, 5), color: "#eef7ff", grav: -60,
    });
  }
}
function ember(x, y) {
  particles.push({
    x, y, vx: rand(-30, 30), vy: rand(-160, -70),
    life: rand(0.5, 1.1), t: 0, size: rand(2, 4),
    color: pick(["#ffb347", "#ff7a3d", "#ffe08a"]), grav: -40,
  });
}
function newFlake(anywhere) {
  return {
    x: rand(0, W),
    y: anywhere ? cam.y + rand(0, H) : cam.y - 12,
    vx: rand(-14, 14), vy: rand(28, 70),
    size: rand(1, 3), layer: Math.random() < 0.5 ? 0.6 : 1,
  };
}

// ---------------------------------------------------------------- actions
function tryJump() {
  player.jbuf = JUMP_BUF;
  if (player.grounded || player.coyote > 0) {
    doJump(JUMP_V);
  } else if (effects.djump > 0 && !player.usedDouble) {
    player.vy = -JUMP_V * 0.95;
    player.usedDouble = true;
    player.jbuf = 0;
    player.stretch = 1;
    puff(player.x, player.y + P_H / 2, 8);
    sfx.djump();
  }
}
function doJump(v) {
  player.vy = -v;
  player.grounded = null;
  player.coyote = 0;
  player.jbuf = 0;
  player.stretch = 1;
  sfx.jump();
}
function tryShoot() {
  if (player.shootCd > 0) return;
  player.shootCd = SHOOT_CD;
  shots.push({ x: player.x + player.face * 22, y: player.y - 4, vx: player.face * SHOT_SPEED, t: 0 });
  sfx.throw();
}
function damage(n) {
  if (player.invuln > 0 || state !== "playing") return;
  player.hp -= n;
  player.invuln = 1.2;
  shake = Math.max(shake, 0.3);
  if (player.hp <= 0) { die(); return; }
  sfx.hurt();
}
function die() {
  state = "dying";
  dyingT = 0;
  effects.wings = 0; effects.djump = 0;
  shake = 0.45;
  sfx.splash();
  sfx.over();
}

// ---------------------------------------------------------------- game step
function step(dt) {
  gameTime += dt;
  lava.surfT += dt;
  if (shake > 0) shake -= dt;

  // ------ dying: penguin sinks into the lava, then show game over
  if (state === "dying") {
    dyingT += dt;
    player.vy = Math.min(player.vy + GRAV * 0.25 * dt, 120);
    player.y += player.vy * dt;
    stepParticles(dt); stepSnow(dt);
    if (Math.random() < 0.3) ember(rand(40, W - 40), lava.y);
    if (dyingT > 1.5) showGameOver();
    return;
  }

  // ------ timers
  player.coyote = Math.max(0, player.coyote - dt);
  player.jbuf = Math.max(0, player.jbuf - dt);
  player.invuln = Math.max(0, player.invuln - dt);
  player.lavaCd = Math.max(0, player.lavaCd - dt);
  player.shootCd = Math.max(0, player.shootCd - dt);
  player.squash = Math.max(0, player.squash - dt * 4);
  player.stretch = Math.max(0, player.stretch - dt * 4);
  effects.wings = Math.max(0, effects.wings - dt);
  effects.djump = Math.max(0, effects.djump - dt);

  // ------ platforms
  for (const p of platforms) updatePlatform(p, dt);

  // ------ grounded validation (platform may have vanished / crumbled / moved away)
  if (player.grounded) {
    const p = player.grounded;
    const overlap = Math.abs(player.x - p.x) < (p.w + player.w) / 2 - 6;
    const attached = Math.abs(player.y - (p.y - P_H / 2)) < 30;
    if (!p.solid || !overlap || !attached) {
      player.grounded = null;
      player.coyote = COYOTE;
    }
  }

  // ------ horizontal movement
  const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (want !== 0) {
    player.vx = clamp(player.vx + want * ACCEL * dt, -MOVE, MOVE);
    player.face = want;
    player.walkT += dt;
  } else {
    const s = Math.sign(player.vx);
    player.vx -= s * DECEL * dt;
    if (Math.sign(player.vx) !== s) player.vx = 0;
  }

  // ------ vertical movement
  if (effects.wings > 0) {
    player.vy = -WINGS_V;
    player.grounded = null;
    if (Math.random() < 0.5) {
      particles.push({
        x: player.x + rand(-10, 10), y: player.y + P_H / 2,
        vx: rand(-20, 20), vy: rand(60, 130),
        life: 0.4, t: 0, size: rand(2, 4), color: "#ffd465", grav: 0,
      });
    }
  } else if (!player.grounded) {
    player.vy = Math.min(player.vy + GRAV * dt, MAX_FALL);
  }

  // ------ integrate
  const prevBottom = player.y + P_H / 2;
  player.x += player.vx * dt;
  if (player.grounded) {
    const p = player.grounded;
    player.x += p.dx;
    player.y = p.y - P_H / 2;
    player.vy = 0;
  } else {
    player.y += player.vy * dt;
  }
  player.x = clamp(player.x, WALL_L, WALL_R);

  // ------ landing on platforms (one-way, only while falling)
  if (!player.grounded && player.vy >= 0 && effects.wings <= 0) {
    const bottom = player.y + P_H / 2;
    for (const p of platforms) {
      if (!p.solid) continue;
      if (prevBottom <= p.y + 8 && bottom >= p.y &&
          Math.abs(player.x - p.x) < (p.w + player.w) / 2 - 6) {
        player.y = p.y - P_H / 2;
        player.vy = 0;
        player.grounded = p;
        player.usedDouble = false;
        player.squash = 1;
        if (p !== lastLandedPlat) { sfx.land(); puff(player.x, p.y, 4); }
        lastLandedPlat = p;
        if (p.type === "crack" && p.crState === "idle") { p.crState = "shake"; p.crT = 0; }
        if (player.jbuf > 0) doJump(JUMP_V); // buffered jump
        break;
      }
    }
  }

  // ------ track best height / camera
  player.minY = Math.min(player.minY, player.y);
  const camTarget = player.y - H * 0.45;
  if (camTarget < cam.y) cam.y = lerp(cam.y, camTarget, Math.min(1, 14 * dt));

  // ------ lava
  if (lava.pause > 0) lava.pause -= dt;
  else if (lava.grace > 0) lava.grace -= dt;
  else {
    const mult = 0.55 + Math.min(1.75, score() / 240);
    lava.y -= lava.speed * mult * dt;
  }
  lava.y = Math.min(lava.y, cam.y + H + 380); // lava never lags too far behind
  if (Math.random() < 0.12 && lava.y < cam.y + H + 30) ember(rand(20, W - 20), lava.y);

  // lava contact: lose a heart, bounce out (like the original's forced trampoline)
  if (player.y + P_H / 2 >= lava.y && player.lavaCd <= 0) {
    player.lavaCd = 1.0;
    lava.pause = 0.6;
    const wasAlive = player.hp > 1;
    damage(1);
    if (wasAlive) {
      effects.wings = 0;
      player.vy = -LAVA_BOUNCE_V;
      player.y = lava.y - P_H / 2;
      player.grounded = null;
      burst(player.x, lava.y, "#ff7a3d", 20, 300);
      sfx.splash();
    }
  }

  // ------ pickups
  for (const pu of pickups) {
    pu.t += dt;
    if (pu.taken) continue;
    if (Math.abs(player.x - pu.x) < 32 && Math.abs(player.y - pu.y) < 36) {
      pu.taken = true;
      applyPickup(pu);
    }
  }

  // ------ monsters
  for (const m of monsters) {
    updateMonster(m, dt);
    if (m.dead) continue;
    if (Math.abs(player.x - m.x) < (m.w + player.w) / 2 - 5 &&
        Math.abs(player.y - m.y) < (m.h + player.h) / 2 - 5) {
      const playerBottom = player.y + P_H / 2;
      if (player.vy > 120 && playerBottom < m.y + m.h * 0.3) {
        killMonster(m, true);            // stomp!
        player.vy = -JUMP_V * 0.72;
        player.usedDouble = false;
      } else if (player.invuln <= 0) {
        damage(1);
        if (state === "playing") {
          player.vx = (player.x < m.x ? -1 : 1) * 300;
          player.vy = -420;
          player.grounded = null;
        }
      }
    }
  }

  // ------ snowballs
  for (const s of shots) {
    s.t += dt;
    s.x += s.vx * dt;
    for (const m of monsters) {
      if (m.dead) continue;
      if (Math.abs(s.x - m.x) < m.w / 2 + 6 && Math.abs(s.y - m.y) < m.h / 2 + 6) {
        killMonster(m, false);
        s.t = 99;
        break;
      }
    }
  }
  shots = shots.filter(s => s.t < 1.4 && s.x > -30 && s.x < W + 30);

  // ------ pruning (cracked platforms respawn, so judge them by their home spot)
  const cutoff = cam.y + H + 300;
  const anchorY = p => p.type === "crack" ? p.homeY : p.y;
  platforms = platforms.filter(p => anchorY(p) < cutoff && anchorY(p) < lava.y + 120);
  monsters = monsters.filter(m => (m.plat ? platforms.includes(m.plat) : m.y < cutoff && m.y < lava.y + 60) && m.deadT < 0.4);
  pickups = pickups.filter(pu => !pu.taken && pu.y < cutoff && pu.y < lava.y + 40);

  // ------ generate more platforms ahead
  generateAhead();

  stepParticles(dt);
  stepSnow(dt);
  updateHud();
}

function stepParticles(dt) {
  for (const pt of particles) {
    pt.t += dt;
    pt.vy += pt.grav * dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
  }
  particles = particles.filter(pt => pt.t < pt.life);
}
function stepSnow(dt) {
  for (const f of snow) {
    f.x += (f.vx + Math.sin(gameTime * 0.7 + f.y * 0.01) * 12) * dt;
    f.y += f.vy * dt;
    if (f.y > cam.y + H + 10) { f.x = rand(0, W); f.y = cam.y - 10; }
    if (f.x < -5) f.x = W + 5;
    if (f.x > W + 5) f.x = -5;
  }
}

// ambient-only stepping so the menu background stays alive
function stepAmbient(dt) {
  gameTime += dt;
  lava.surfT += dt;
  for (const p of platforms) if (p.type !== "crack") updatePlatform(p, dt);
  for (const m of monsters) updateMonster(m, dt);
  for (const pu of pickups) pu.t += dt;
  stepParticles(dt);
  stepSnow(dt);
}

// ---------------------------------------------------------------- HUD / UI
const $ = id => document.getElementById(id);
function show(id) { $(id).classList.remove("hidden"); }
function hide(id) { $(id).classList.add("hidden"); }

function updateHud() { /* HUD is drawn on canvas each frame */ }

function startGame() {
  audioInit();
  initWorld();
  state = "playing";
  hide("menu"); hide("over"); hide("pause");
  sfx.ui();
}
function showMenu() {
  initWorld();
  state = "menu";
  $("menuBest").textContent = best;
  show("menu"); hide("over"); hide("pause");
}
function showGameOver() {
  state = "gameover";
  const sc = score();
  const isBest = sc > best;
  if (isBest) { best = sc; localStorage.setItem("pj-best", String(best)); }
  $("overScore").textContent = sc;
  $("overBest").textContent = best;
  $("newBest").classList.toggle("hidden", !isBest);
  show("over");
}
function togglePause() {
  if (state === "playing") { state = "paused"; show("pause"); sfx.ui(); }
  else if (state === "paused") { state = "playing"; hide("pause"); sfx.ui(); }
}

$("btnStart").onclick = startGame;
$("btnReplay").onclick = startGame;
$("btnResume").onclick = togglePause;
$("btnPRestart").onclick = startGame;
$("btnPMenu").onclick = showMenu;
$("btnOMenu").onclick = showMenu;
$("btnPause").onclick = () => { audioInit(); togglePause(); };
$("btnMute").onclick = () => { audioInit(); setMuted(!muted); };
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "playing") togglePause();
});
setMuted(muted);

// ---------------------------------------------------------------- rendering
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// sky palette stops by altitude (meters climbed)
const SKY = [
  { m: 0,    top: [126, 187, 224], bot: [214, 238, 250] },
  { m: 250,  top: [96, 132, 200],  bot: [244, 187, 187] },
  { m: 550,  top: [52, 62, 120],   bot: [150, 110, 160] },
  { m: 900,  top: [16, 20, 52],    bot: [60, 50, 100] },
  { m: 1400, top: [5, 7, 24],      bot: [20, 22, 52] },
];
function skyColors(mAlt) {
  let a = SKY[0], b = SKY[0];
  for (let i = 0; i < SKY.length; i++) {
    if (mAlt >= SKY[i].m) { a = SKY[i]; b = SKY[Math.min(i + 1, SKY.length - 1)]; }
  }
  const t = b.m === a.m ? 0 : clamp((mAlt - a.m) / (b.m - a.m), 0, 1);
  const mix = (u, v) => [0, 1, 2].map(i => Math.round(lerp(u[i], v[i], t)));
  return { top: mix(a.top, b.top), bot: mix(a.bot, b.bot), space: clamp((mAlt - 500) / 700, 0, 1) };
}
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;

// deterministic pseudo-random for background features
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function ridge(x, seed) {
  return Math.sin(x * 0.011 + seed) * 34 + Math.sin(x * 0.027 + seed * 2.7) * 16 + Math.sin(x * 0.053 + seed * 1.3) * 7;
}

function drawBackground() {
  const mAlt = Math.max(0, (startY - Math.min(player.minY, player.y)) / 10);
  const sky = skyColors(mAlt);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, css(sky.top));
  grad.addColorStop(1, css(sky.bot));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // stars fade in with altitude
  if (sky.space > 0.02) {
    ctx.save();
    for (let i = 0; i < 60; i++) {
      const sx = hash(i) * W;
      const sy = (hash(i + 60) * H * 1.4 + cam.y * 0.06) % (H + 20);
      const tw = 0.5 + 0.5 * Math.sin(gameTime * (1 + hash(i + 120) * 2) + i);
      ctx.globalAlpha = sky.space * (0.3 + 0.7 * tw) * (0.4 + 0.6 * hash(i + 30));
      ctx.fillStyle = "#fff";
      ctx.fillRect(sx, (sy + H) % H, 2, 2);
    }
    ctx.restore();
  }

  // glacial mountain layers (vertical parallax, they sink away as you climb)
  const layers = [
    { p: 0.1, base: H * 0.62, seed: 3.1, c: "rgba(255,255,255,0.35)" },
    { p: 0.2, base: H * 0.74, seed: 7.7, c: "rgba(235,247,255,0.55)" },
  ];
  for (const L of layers) {
    const yy = L.base + (camStart - cam.y) * L.p;
    if (yy > H + 60) continue;
    ctx.fillStyle = L.c;
    ctx.beginPath();
    ctx.moveTo(0, H + 50);
    for (let x = 0; x <= W; x += 12) {
      ctx.lineTo(x, yy + ridge(x, L.seed));
    }
    ctx.lineTo(W, H + 50);
    ctx.closePath();
    ctx.fill();
  }

  // drifting clouds at low/mid altitude
  ctx.save();
  for (let i = 0; i < 8; i++) {
    const wy = -300 - i * 600 - hash(i + 7) * 380;
    const sy2 = (wy - cam.y) * 0.5;
    if (sy2 < -60 || sy2 > H + 60) continue;
    const sx = (hash(i + 3) * (W + 240) - 120 + gameTime * (4 + hash(i) * 6)) % (W + 240) - 120;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#ffffff";
    rr(sx, sy2, 130 + hash(i + 9) * 80, 26, 14); ctx.fill();
    rr(sx + 26, sy2 - 14, 70 + hash(i + 5) * 40, 22, 12); ctx.fill();
  }
  ctx.restore();

  // frosty side walls
  const wallGrad = ctx.createLinearGradient(0, 0, 14, 0);
  wallGrad.addColorStop(0, "rgba(220,240,255,0.35)");
  wallGrad.addColorStop(1, "rgba(220,240,255,0)");
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 0, 14, H);
  ctx.save();
  ctx.translate(W, 0); ctx.scale(-1, 1);
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 0, 14, H);
  ctx.restore();

  // background snow layer
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (const f of snow) {
    if (f.layer !== 0.6) continue;
    ctx.fillRect(f.x, (f.y - cam.y) * 1, f.size, f.size);
  }
}

function drawPlatform(p) {
  const x = p.x - p.w / 2;
  let y = p.y;
  let alpha = 1;
  if (p.type === "blink") {
    if (p.blinkT >= 2.6) alpha = 0.06;
    else if (p.blinkT > 2.0) alpha = 0.35 + 0.55 * Math.abs(Math.sin(p.blinkT * 22)); // warning flash
  }
  let shx = 0;
  if (p.type === "crack" && p.crState === "shake") shx = Math.sin(p.crT * 60) * 2.5;
  if (p.type === "crack" && p.crState === "fall") alpha = 0.85;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(shx, 0);

  const colors = {
    "ice":    ["#eaf7ff", "#bfe3f5", "#8fc6e5"],
    "move-h": ["#d7f0ff", "#9ed4f2", "#5aa8d8"],
    "move-v": ["#d7f0ff", "#9ed4f2", "#5aa8d8"],
    "crack":  ["#e8d9c8", "#cbb49a", "#a08663"],
    "blink":  ["#eadcff", "#c9aef5", "#9c7ad9"],
  }[p.type];

  // slab
  const g = ctx.createLinearGradient(0, y, 0, y + p.h);
  g.addColorStop(0, colors[0]);
  g.addColorStop(0.45, colors[1]);
  g.addColorStop(1, colors[2]);
  ctx.fillStyle = g;
  rr(x, y, p.w, p.h, 8);
  ctx.fill();
  // snow cap
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  rr(x + 3, y, p.w - 6, 6, 3);
  ctx.fill();
  // icicles
  ctx.fillStyle = colors[2];
  for (const ic of p.icicles) {
    const ix = p.x + ic.o * p.w;
    ctx.beginPath();
    ctx.moveTo(ix - 4, y + p.h - 1);
    ctx.lineTo(ix + 4, y + p.h - 1);
    ctx.lineTo(ix, y + p.h + ic.l);
    ctx.closePath();
    ctx.fill();
  }
  // decorations per type
  if (p.type === "move-h" || p.type === "move-v") {
    ctx.fillStyle = "rgba(30,80,130,0.55)";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.type === "move-h" ? "◀ ▶" : "▲ ▼", p.x, y + 14);
  }
  if (p.type === "crack") {
    ctx.strokeStyle = "rgba(90,60,30,0.6)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(p.x - p.w * 0.3, y + 3);
    ctx.lineTo(p.x - p.w * 0.12, y + 10);
    ctx.lineTo(p.x - p.w * 0.2, y + p.h - 3);
    ctx.moveTo(p.x + p.w * 0.25, y + 2);
    ctx.lineTo(p.x + p.w * 0.1, y + 9);
    ctx.lineTo(p.x + p.w * 0.22, y + p.h - 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPickup(pu) {
  const bob = Math.sin(pu.t * 3) * 5;
  const x = pu.x, y = pu.y + bob;
  ctx.save();
  // glow
  ctx.globalAlpha = 0.25 + 0.15 * Math.sin(pu.t * 5);
  ctx.fillStyle = { spring: "#ff8563", wings: "#ffd465", djump: "#7fd8ff", heart: "#ff6b8d" }[pu.type];
  ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  if (pu.type === "spring") {
    ctx.fillStyle = "#c0392b";
    rr(x - 12, y - 12, 24, 6, 3); ctx.fill();
    ctx.strokeStyle = "#e8e8e8"; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      ctx.moveTo(x - 8, y - 5 + i * 5);
      ctx.lineTo(x + 8, y - 3 + i * 5);
    }
    ctx.stroke();
    ctx.fillStyle = "#c0392b";
    rr(x - 12, y + 9, 24, 5, 2); ctx.fill();
  } else if (pu.type === "wings") {
    ctx.fillStyle = "#ffd465";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + s * 20, y - 16, x + s * 15, y + 2);
      ctx.quadraticCurveTo(x + s * 10, y + 8, x, y + 4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y + 1, 4, 0, Math.PI * 2); ctx.fill();
  } else if (pu.type === "djump") {
    ctx.strokeStyle = "#eaf9ff"; ctx.fillStyle = "#7fd8ff";
    ctx.lineWidth = 2;
    for (const o of [4, -5]) {
      ctx.beginPath();
      ctx.moveTo(x - 10, y + o + 5);
      ctx.lineTo(x, y + o - 4);
      ctx.lineTo(x + 10, y + o + 5);
      ctx.lineTo(x + 5, y + o + 5);
      ctx.lineTo(x, y + o + 1);
      ctx.lineTo(x - 5, y + o + 5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  } else { // heart
    ctx.fillStyle = "#ff5c7f";
    drawHeart(x, y, 11);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath(); ctx.arc(x - 4, y - 4, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawHeart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.65);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.25, x - s * 0.55, y - s, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.55, y - s, x + s * 1.1, y - s * 0.25, x, y + s * 0.65);
  ctx.closePath();
}

function drawMonster(m) {
  ctx.save();
  const deadScale = m.dead ? Math.max(0, 1 - m.deadT / 0.35) : 1;
  ctx.translate(m.x, m.y);
  ctx.scale(m.dir < 0 ? -1 : 1, 1);
  ctx.scale(deadScale, deadScale);
  if (m.dead) ctx.rotate(m.deadT * 6);

  if (m.type === "slime") {
    const sq = 1 + Math.sin(m.t * 8) * 0.08;
    ctx.scale(1 / sq, sq);
    // body
    const g = ctx.createLinearGradient(0, -14, 0, 13);
    g.addColorStop(0, "#a5ec7e"); g.addColorStop(1, "#5cb845");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-17, 13);
    ctx.quadraticCurveTo(-19, -12, 0, -13);
    ctx.quadraticCurveTo(19, -12, 17, 13);
    ctx.closePath();
    ctx.fill();
    // eyes
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(4, -4, 4.5, 0, Math.PI * 2); ctx.arc(12, -4, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(5.5, -4, 2, 0, Math.PI * 2); ctx.arc(13.2, -4, 1.8, 0, Math.PI * 2); ctx.fill();
    // mouth
    ctx.strokeStyle = "#2c5e22"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(8, 3, 4, 0.15, Math.PI - 0.15); ctx.stroke();
  } else {
    // frost bat
    const flap = Math.sin(m.t * 12) * 0.7;
    ctx.fillStyle = "#8f6fd8";
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * 8, -2);
      ctx.rotate(s * flap);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 18, -14, s * 22, 2);
      ctx.quadraticCurveTo(s * 12, 6, 0, 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    const g = ctx.createLinearGradient(0, -12, 0, 12);
    g.addColorStop(0, "#b48cf2"); g.addColorStop(1, "#7a55c4");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    // ears
    ctx.beginPath();
    ctx.moveTo(-9, -7); ctx.lineTo(-12, -16); ctx.lineTo(-3, -11);
    ctx.moveTo(9, -7); ctx.lineTo(12, -16); ctx.lineTo(3, -11);
    ctx.fill();
    // eyes
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-4, -2, 3.4, 0, Math.PI * 2); ctx.arc(4, -2, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e33";
    ctx.beginPath(); ctx.arc(-4, -2, 1.6, 0, Math.PI * 2); ctx.arc(4, -2, 1.6, 0, Math.PI * 2); ctx.fill();
    // fangs
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(-3, 6); ctx.lineTo(-1.5, 10); ctx.lineTo(0, 6);
    ctx.moveTo(3, 6); ctx.lineTo(1.5, 10); ctx.lineTo(0, 6);
    ctx.fill();
  }
  ctx.restore();
}

function drawPenguin() {
  const p = player;
  ctx.save();
  ctx.translate(p.x, p.y);

  // invulnerability flicker
  if (p.invuln > 0 && state === "playing" && Math.floor(p.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.35;

  // squash & stretch
  const sq = 1 + p.squash * 0.22 - p.stretch * 0.18;
  ctx.scale((p.face < 0 ? -1 : 1) * (2 - sq), sq);
  if (state === "dying") ctx.rotate(Math.sin(dyingT * 10) * 0.3);

  const flying = effects.wings > 0;
  const airborne = !p.grounded;

  // wings-powerup golden wings
  if (flying) {
    const flap = Math.sin(gameTime * 16) * 0.8;
    ctx.fillStyle = "#ffd465";
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * 13, -4);
      ctx.rotate(s * (0.3 + flap));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 24, -18, s * 28, 0);
      ctx.quadraticCurveTo(s * 14, 8, 0, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  // feet
  ctx.fillStyle = "#f5a13c";
  const ft = p.grounded && Math.abs(p.vx) > 20 ? Math.sin(p.walkT * 18) * 3 : 0;
  rr(-13, 17 + ft, 11, 5, 2.5); ctx.fill();
  rr(2, 17 - ft, 11, 5, 2.5); ctx.fill();

  // body
  const bg = ctx.createLinearGradient(0, -21, 0, 21);
  bg.addColorStop(0, "#38404f");
  bg.addColorStop(1, "#171c26");
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 20, 0, 0, Math.PI * 2);
  ctx.fill();

  // belly
  ctx.fillStyle = "#f4f9fc";
  ctx.beginPath();
  ctx.ellipse(1.5, 3.5, 11, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // flipper (back one hidden by flip) — waves when airborne
  ctx.fillStyle = "#232a36";
  ctx.save();
  ctx.translate(-13, -2);
  ctx.rotate(airborne ? -0.9 + Math.sin(gameTime * 14) * 0.25 : 0.35);
  ctx.beginPath();
  ctx.ellipse(0, 6, 4.5, 11, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // beak
  ctx.fillStyle = "#f5a13c";
  ctx.beginPath();
  ctx.moveTo(11, -7);
  ctx.lineTo(21, -4);
  ctx.lineTo(11, -1);
  ctx.closePath();
  ctx.fill();

  // eye
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(7, -10, 4.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#141414";
  ctx.beginPath(); ctx.arc(8.4, -10, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(9.2, -10.8, 0.9, 0, Math.PI * 2); ctx.fill();

  // little scarf for charm
  ctx.strokeStyle = "#e2574c"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-9, -4); ctx.quadraticCurveTo(0, 0, 10, -4); ctx.stroke();
  ctx.fillStyle = "#e2574c";
  rr(-4, -3, 5, 9, 2); ctx.fill();

  ctx.restore();
}

function drawLava() {
  const ly = lava.y - cam.y;
  if (ly > H + 60) return;
  const t = lava.surfT;

  // glow above the surface
  const glow = ctx.createLinearGradient(0, ly - 80, 0, ly);
  glow.addColorStop(0, "rgba(255,110,40,0)");
  glow.addColorStop(1, "rgba(255,110,40,0.35)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, ly - 80, W, 80);

  // body
  const g = ctx.createLinearGradient(0, ly, 0, Math.min(H, ly + 260));
  g.addColorStop(0, "#ffca5f");
  g.addColorStop(0.12, "#ff8c33");
  g.addColorStop(0.5, "#e8431f");
  g.addColorStop(1, "#8c1508");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H + 4);
  ctx.lineTo(0, ly + 8);
  for (let x = 0; x <= W; x += 10) {
    const yy = ly + Math.sin(x * 0.045 + t * 2.2) * 4 + Math.sin(x * 0.021 - t * 1.4) * 3;
    ctx.lineTo(x, yy);
  }
  ctx.lineTo(W, H + 4);
  ctx.closePath();
  ctx.fill();

  // bright surface line
  ctx.strokeStyle = "rgba(255,235,150,0.9)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 10) {
    const yy = ly + Math.sin(x * 0.045 + t * 2.2) * 4 + Math.sin(x * 0.021 - t * 1.4) * 3;
    x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
  }
  ctx.stroke();

  // bubbles
  for (let i = 0; i < 6; i++) {
    const bx = (hash(i + 40) * W + t * (14 + i * 6)) % W;
    const by = ly + 24 + hash(i + 50) * 120;
    if (by > H) continue;
    const r = 3 + Math.sin(t * 3 + i * 2) * 2;
    if (r <= 0.5) continue;
    ctx.fillStyle = "rgba(255,170,60,0.6)";
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawHudCanvas() {
  // hearts
  for (let i = 0; i < MAX_HP; i++) {
    const x = 26 + i * 32, y = 28;
    ctx.save();
    ctx.fillStyle = i < player.hp ? "#ff5c7f" : "rgba(255,255,255,0.22)";
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 2;
    drawHeart(x, y, 12);
    ctx.fill();
    ctx.stroke();
    if (i < player.hp) {
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath(); ctx.arc(x - 4.5, y - 5, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // score
  ctx.save();
  ctx.textAlign = "center";
  ctx.font = "900 30px 'Segoe UI', system-ui, sans-serif";
  ctx.lineWidth = 5;
  ctx.strokeStyle = "rgba(8,25,50,0.75)";
  ctx.fillStyle = "#ffffff";
  const sc = String(score());
  ctx.strokeText(sc, W / 2, 40);
  ctx.fillText(sc, W / 2, 40);
  ctx.font = "700 12px 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = "#cfe8ff";
  ctx.strokeStyle = "rgba(8,25,50,0.6)";
  ctx.lineWidth = 3;
  const bt = "BEST " + Math.max(best, score());
  ctx.strokeText(bt, W / 2, 57);
  ctx.fillText(bt, W / 2, 57);
  ctx.restore();

  // active power-up chip
  const chips = [];
  if (effects.wings > 0) chips.push({ label: "WINGS", t: effects.wings / WINGS_TIME, c: "#ffd465" });
  if (effects.djump > 0) chips.push({ label: "DOUBLE JUMP", t: effects.djump / DJUMP_TIME, c: "#7fd8ff" });
  let cy = 76;
  for (const ch of chips) {
    ctx.save();
    ctx.translate(W / 2, cy);
    ctx.fillStyle = "rgba(8,25,50,0.55)";
    rr(-62, -11, 124, 22, 11); ctx.fill();
    ctx.fillStyle = ch.c;
    ctx.font = "800 10px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(ch.label, 0, -1);
    rr(-52, 4, 104 * clamp(ch.t, 0, 1), 4, 2); ctx.fill();
    ctx.restore();
    cy += 28;
  }
}

function render() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);

  drawBackground();

  // camera (+ shake)
  ctx.save();
  const shk = shake > 0 ? shake * 14 : 0;
  ctx.translate(
    shk ? rand(-shk, shk) : 0,
    -cam.y + (shk ? rand(-shk, shk) : 0)
  );

  for (const p of platforms) drawPlatform(p);
  for (const pu of pickups) drawPickup(pu);
  for (const m of monsters) drawMonster(m);
  drawPenguin();

  // snowballs
  for (const s of shots) {
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.beginPath(); ctx.arc(s.x - s.vx * 0.02, s.y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#a8d4ee"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // particles
  for (const pt of particles) {
    ctx.globalAlpha = clamp(1 - pt.t / pt.life, 0, 1);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // lava works in screen coordinates, so draw it outside the camera transform
  drawLava();

  // foreground snow
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  for (const f of snow) {
    if (f.layer !== 1) continue;
    ctx.beginPath();
    ctx.arc(f.x, f.y - cam.y, f.size, 0, Math.PI * 2);
    ctx.fill();
  }

  if (state !== "menu") drawHudCanvas();

  // grayscale death fade (like the original's post-processing volume) —
  // done with a cheap saturation blend, full-canvas ctx.filter is far too slow
  const gs = state === "dying" ? clamp(dyingT, 0, 1) : state === "gameover" ? 1 : 0;
  if (gs > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "saturation";
    ctx.globalAlpha = gs;
    ctx.fillStyle = "#808080";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = gs * 0.25;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

// ---------------------------------------------------------------- main loop
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let ft = (now - last) / 1000;
  last = now;
  acc += Math.min(ft, 0.1);
  while (acc >= DT) {
    if (state === "playing" || state === "dying") step(DT);
    else if (state === "menu") stepAmbient(DT);
    acc -= DT;
  }
  render();
}

showMenu();
requestAnimationFrame(frame);

// ---------------------------------------------------------------- debug hook
// open with #debug (or ?debug) to expose a handle for automated testing
if (location.hash === "#debug" || new URLSearchParams(location.search).has("debug")) {
  window.__pj = {
    get state() { return state; },
    get score() { return score(); },
    get hp() { return player.hp; },
    get player() { return player; },
    get lava() { return lava; },
    get platforms() { return platforms; },
    get monsters() { return monsters; },
    get pickups() { return pickups; },
    get effects() { return effects; },
    start: startGame,
    damage: n => damage(n),
    kill: () => { player.invuln = 0; player.hp = 1; damage(1); },
    press: k => { if (!keys[k]) { keys[k] = true; onPress(k); } },
    release: k => { keys[k] = false; onRelease(k); },
  };
}
</script>
</body>
</html>
